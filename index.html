        function App() {
            const [activeTab, setActiveTab] = useState('deals');
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [searchQuery, setSearchQuery] = useState('');
            const [sortBy, setSortBy] = useState('bigY');
            const [basket, setBasket] = useState({});
            const [isScanning, setIsScanning] = useState(false);
            const [scanStatus, setScanStatus] = useState('');
            const [menuOpen, setMenuOpen] = useState(false);
            
            // Location state (Initial state null to force setup prompt)
            const [currentLocation, setCurrentLocation] = useState(null);
            const [isInitialLocationSetup, setIsInitialLocationSetup] = useState(true);
            const [locationModalOpen, setLocationModalOpen] = useState(true);
            const [customAddressInput, setCustomAddressInput] = useState('');

            // Trends category selector state
            const [trendCategory, setTrendCategory] = useState('All');

            const categories = [
                { name: 'All Cuts', icon: '🥩' },
                { name: 'Ground Beef', icon: '🍔' },
                { name: 'Steaks', icon: '🥩' },
                { name: 'Ribs & Pork', icon: '🍖' },
                { name: 'Poultry', icon: '🍗' },
                { name: 'Seafood', icon: '🐟' }
            ];

            const presetLocations = [
                'Cheshire Center (Town Hall)',
                'Southington (Queen St corridor)',
                'Wallingford Center',
                'Meriden (East Main)',
                'Hamden (Dixwell Ave)'
            ];

            const handleUseGPS = () => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const gpsCoords = `GPS: ${position.coords.latitude.toFixed(4)}, ${position.coords.longitude.toFixed(4)}`;
                            setCurrentLocation(gpsCoords);
                            setIsInitialLocationSetup(false);
                            setLocationModalOpen(false);
                        },
                        () => {
                            alert('Unable to retrieve your location via GPS. Please enter your address or select a preset.');
                        }
                    );
                } else {
                    alert('Geolocation is not supported by your browser. Please enter your address.');
                }
            };

            const handleSetLocation = (address) => {
                if (address && address.trim()) {
                    setCurrentLocation(address.trim());
                    setIsInitialLocationSetup(false);
                    setLocationModalOpen(false);
                    setCustomAddressInput('');
                }
            };

            const handleScanFlyers = () => {
                setIsScanning(true);
                setScanStatus('Connecting to Big Y, Stop & Shop, ShopRite & ALDI circular APIs...');
                setTimeout(() => {
                    setScanStatus('Analyzing local weekly ads within 15 min radius...');
                    setTimeout(() => {
                        setIsScanning(false);
                        setScanStatus('');
                        alert('Flyers successfully refreshed! All prices verified for this week.');
                    }, 1200);
                }, 1000);
            };

            const addToBasket = (item) => {
                setBasket(prev => ({
                    ...prev,
                    [item.id]: {
                        ...item,
                        qty: (prev[item.id]?.qty || 1)
                    }
                }));
            };

            const updateQty = (id, delta) => {
                setBasket(prev => {
                    const current = prev[id]?.qty || 0;
                    const next = current + delta;
                    if (next <= 0) {
                        const copy = { ...prev };
                        delete copy[id];
                        return copy;
                    }
                    return {
                        ...prev,
                        [id]: { ...prev[id], qty: next }
                    };
                });
            };

            const filteredDeals = useMemo(() => {
                return INITIAL_DEALS.filter(item => {
                    const matchesCategory = selectedCategory === 'All' || item.category === selectedCategory;
                    const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                          item.store.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchesCategory && matchesSearch;
                }).sort((a, b) => {
                    if (sortBy === 'bigY') {
                        if (a.store.includes('Big Y') && !b.store.includes('Big Y')) return -1;
                        if (!a.store.includes('Big Y') && b.store.includes('Big Y')) return 1;
                        return a.price - b.price;
                    }
                    if (sortBy === 'priceAsc') return a.price - b.price;
                    if (sortBy === 'discount') return parseInt(b.discount) - parseInt(a.discount);
                    if (sortBy === 'distance') return parseFloat(a.distance) - parseFloat(b.distance);
                    return 0;
                });
            }, [selectedCategory, searchQuery, sortBy]);

            const basketItemsList = Object.values(basket);
            const totalBasketCost = basketItemsList.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const totalBasketItemsCount = basketItemsList.reduce((sum, item) => sum + item.qty, 0);

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col pb-20">

                    </header>

                    {/* Primary Store Callout Banner */}

                                        <div className="space-y-1.5 text-sm">

                                            <a href="https://circular.stopandshop.com/" target="_blank" rel="noopener noreferrer" className="block px-3 py-2 rounded-lg bg-slate-800/60 hover:bg-slate-800 text-slate-200 transition">Stop & Shop Cheshire ↗</a>
                                            <a href="https://www.shoprite.com/weeklycircular" target="_blank" rel="noopener noreferrer" className="block px-3 py-2 rounded-lg bg-slate-800/60 hover:bg-slate-800 text-slate-200 transition">ShopRite Southington ↗</a>
                                            <a href="https://www.aldi.us/en/weekly-specials/our-weekly-ads/" target="_blank" rel="noopener noreferrer" className="block px-3 py-2 rounded-lg bg-slate-800/60 hover:bg-slate-800 text-slate-200 transition">ALDI Southington ↗</a>
                                            <a href="https://www.thefreshmarket.com/weekly-specials" target="_blank" rel="noopener noreferrer" className="block px-3 py-2 rounded-lg bg-slate-800/60 hover:bg-slate-800 text-slate-200 transition">The Fresh Market ↗</a>
                                        </div>
                                    </div>
                                </div>

                                <div className="pt-4 border-t border-slate-800 text-center text-xs text-slate-500">
                                    Current Location: {currentLocation || 'Not Set'}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Main Content Area */}
                    <main className="flex-1 max-w-4xl w-full mx-auto p-4">
                        
                        {/* TAB 1: DEALS DIRECTORY */}
                        {activeTab === 'deals' && (
                            <div className="space-y-4">
                                {/* Search & Sort Bar */}
                                <div className="flex flex-col sm:flex-row gap-2">
                                    <div className="relative flex-1">
                                        <span className="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">🔍</span>
                                        <input 
                                            type="text"
                                            placeholder="Search cuts (e.g. Ribeye, Cod, Chicken)..."
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            className="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-rose-500 text-slate-100 placeholder-slate-500"
                                        />
                                    </div>
                                    <select 
                                        value={sortBy}
                                        onChange={(e) => setSortBy(e.target.value)}
                                        className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-300 focus:outline-none focus:border-rose-500"
                                    >
                                        <option value="bigY">Sort: Big Y Priority First</option>
                                        <option value="priceAsc">Sort: Lowest Price ($/lb)</option>
                                        <option value="discount">Sort: Highest Discount %</option>
                                        <option value="distance">Sort: Closest Distance</option>
                                    </select>
                                </div>

                                {/* Category Filter Pills with Icons */}

                                    {categories.map(cat => (
                                        <button
                                            key={cat.name}
                                            onClick={() => setSelectedCategory(cat.name)}
                                            className={`flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition shadow-sm ${
                                                selectedCategory === cat.name
                                                    ? 'bg-rose-600 text-white shadow-rose-900/40'
                                                    : 'bg-slate-900 border border-slate-800 text-slate-300 hover:bg-slate-800'
                                            }`}
                                        >
                                            <span>{cat.icon}</span>
                                            <span>{cat.name}</span>
                                        </button>
                                    ))}
                                </div>

                                {/* Item Deals Cards */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    {filteredDeals.map(item => (
                                        <div key={item.id} className="bg-slate-900 border border-slate-800/80 rounded-2xl p-4 flex flex-col justify-between hover:border-slate-700 transition shadow-lg">

                                                <div className="flex items-center justify-between mb-2">
                                                    <div className="flex items-center gap-2">
                                                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-lg ${
                                                            item.store.includes('Big Y') 
                                                                ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' 
                                                                : 'bg-slate-800 text-slate-300'
                                                        }`}>
                                                            {item.badge} ({item.distance.split(' ')[0]}m)
                                                        </span>
                                                        <span className="text-xs text-slate-400 truncate max-w-[140px]">{item.store}</span>
                                                    </div>
                                                    <span className="text-xs font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-lg">
                                                        {item.discount}
                                                    </span>
                                                </div>

                                                <h3 className="font-semibold text-sm sm:text-base text-slate-100 mb-1">{item.name}</h3>
                                                <p className="text-xs text-slate-400 mb-3">{item.notes}</p>
                                            </div>

                                            <div className="flex items-end justify-between pt-3 border-t border-slate-800/60">
                                                <div>
                                                    <div className="flex items-baseline gap-2">
                                                        <span className="text-lg sm:text-xl font-extrabold text-emerald-400">${item.price.toFixed(2)}</span>
                                                        <span className="text-xs text-slate-400">/{item.unit}</span>
                                                        <span className="text-xs text-slate-500 line-through">${item.originalPrice.toFixed(2)}</span>
                                                    </div>
                                                    <a 
                                                        href={item.flyerUrl} 
                                                        target="_blank" 
                                                        rel="noopener noreferrer" 
                                                        className="text-[11px] text-amber-400 hover:underline mt-0.5 inline-block"
                                                    >
                                                        View Circular ↗
                                                    </a>
                                                </div>

                                                <button
                                                    onClick={() => addToBasket(item)}
                                                    className="bg-slate-800 hover:bg-rose-600 text-slate-200 hover:text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 shadow"
                                                >
                                                    <span>+ Basket</span>
                                                </button>
                                            </div>
                                        </div>
                                    ))}

                                    {filteredDeals.length === 0 && (
                                        <div className="col-span-full py-12 text-center text-slate-500 text-sm">
                                            No meat or seafood deals found matching your search.
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* TAB 2: PRICE TRENDS */}
                        {activeTab === 'trends' && (
                            <div className="space-y-4">
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5">
                                    <div className="flex items-center justify-between mb-3">
                                        <h2 className="font-bold text-base sm:text-lg flex items-center gap-2">
                                            <span>📈</span> 30-Day Local Price Trends ($/lb)
                                        </h2>
                                        <span className="text-xs text-slate-400 bg-slate-800 px-2.5 py-1 rounded-lg">Cheshire & Southington Area</span>
                                    </div>
                                    <p className="text-xs text-slate-400 mb-4">Compare price trajectories across local grocery circulars over the past month.</p>

                                    {/* Category Filter for Trends */}
                                    <div className="flex gap-2 overflow-x-auto pb-3 mb-2 scrollbar-none">
                                        {categories.map(cat => (
                                            <button
                                                key={cat.name}
                                                onClick={() => setTrendCategory(cat.name)}
                                                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition ${
                                                    trendCategory === cat.name
                                                        ? 'bg-rose-600 text-white'
                                                        : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                                                }`}
                                            >
                                                <span>{cat.icon}</span>
                                                <span>{cat.name}</span>
                                            </button>
                                        ))}
                                    </div>

                                    {/* SVG Chart Graphic */}
                                    <div className="bg-slate-950 rounded-xl p-4 border border-slate-800">
                                        <div className="h-64 w-full flex flex-col justify-between relative">
                                            <div className="absolute inset-0 p-4 flex items-center justify-center">
                                                <svg className="w-full h-full overflow-visible" viewBox="0 0 500 200" preserveAspectRatio="none">
                                                    <line x1="0" y1="0" x2="500" y2="0" stroke="#334155" strokeDasharray="4" strokeWidth="1" />
                                                    <line x1="0" y1="50" x2="500" y2="50" stroke="#334155" strokeDasharray="4" strokeWidth="1" />
                                                    <line x1="0" y1="100" x2="500" y2="100" stroke="#334155" strokeDasharray="4" strokeWidth="1" />
                                                    <line x1="0" y1="150" x2="500" y2="150" stroke="#334155" strokeDasharray="4" strokeWidth="1" />

                                                    {(trendCategory === 'All Cuts' || trendCategory === 'Steaks') && (
                                                        <path d="M 0,40 Q 100,20 200,70 T 400,90 T 500,100" fill="none" stroke="#10b981" strokeWidth="3" />
                                                    )}
                                                    {(trendCategory === 'All Cuts' || trendCategory === 'Seafood') && (
                                                        <path d="M 0,20 Q 100,10 200,50 T 400,70 T 500,80" fill="none" stroke="#38bdf8" strokeWidth="3" />
                                                    )}
                                                    {(trendCategory === 'All Cuts' || trendCategory === 'Ground Beef') && (
                                                        <path d="M 0,80 Q 100,90 200,110 T 400,120 T 500,130" fill="none" stroke="#f59e0b" strokeWidth="3" />
                                                    )}
                                                    {(trendCategory === 'All Cuts' || trendCategory === 'Ribs & Pork') && (
                                                        <path d="M 0,140 Q 100,135 200,150 T 400,155 T 500,160" fill="none" stroke="#a855f7" strokeWidth="3" />
                                                    )}
                                                    {(trendCategory === 'All Cuts' || trendCategory === 'Poultry') && (
                                                        <path d="M 0,165 Q 100,160 200,170 T 400,175 T 500,180" fill="none" stroke="#f43f5e" strokeWidth="3" />
                                                    )}
                                                </svg>
                                            </div>

                                            <div className="mt-auto pt-2 flex justify-between text-[10px] text-slate-400 z-10 border-t border-slate-800">
                                                <span>Oct 1</span>
                                                <span>Oct 8</span>
                                                <span>Oct 15</span>
                                                <span>Oct 22</span>
                                                <span>Oct 29</span>
                                                <span>Nov 3</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 3: BASKET */}
                        {activeTab === 'basket' && (
                            <div className="space-y-4">
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5">
                                    <h2 className="font-bold text-base sm:text-lg mb-1 flex items-center gap-2">
                                        <span>🛒</span> Jerry's Meat Locker ({totalBasketItemsCount} items)
                                    </h2>
                                    <p className="text-xs text-slate-400 mb-4">Manage quantities and optimize your local driving route from {currentLocation || 'your starting point'}.</p>

                                    {basketItemsList.length > 0 ? (
                                        <div className="space-y-3">
                                            {basketItemsList.map(item => (
                                                <div key={item.id} className="bg-slate-800/60 border border-slate-700/60 rounded-xl p-3 flex items-center justify-between">
                                                    <div>
                                                        <h4 className="font-semibold text-sm text-slate-200">{item.name}</h4>
                                                        <p className="text-xs text-amber-300">{item.store} • ${item.price.toFixed(2)}/{item.unit}</p>
                                                    </div>

                                                    <div className="flex items-center space-x-3">
                                                        <div className="flex items-center bg-slate-900 rounded-lg border border-slate-700">
                                                            <button onClick={() => updateQty(item.id, -1)} className="px-2.5 py-1 text-slate-400 hover:text-white font-bold">-</button>
                                                            <span className="px-2 text-xs font-semibold">{item.qty} {item.unit}</span>
                                                            <button onClick={() => updateQty(item.id, 1)} className="px-2.5 py-1 text-slate-400 hover:text-white font-bold">+</button>
                                                        </div>
                                                        <span className="font-bold text-emerald-400 text-sm w-16 text-right">${(item.price * item.qty).toFixed(2)}</span>
                                                    </div>
                                                </div>
                                            ))}

                                            <div className="pt-4 border-t border-slate-800 flex items-center justify-between">
                                                <div>
                                                    <p className="text-xs text-slate-400">Estimated Total Cost:</p>
                                                    <p className="text-xl font-extrabold text-emerald-400">${totalBasketCost.toFixed(2)}</p>
                                                </div>

                                                <a 
                                                    href={`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(currentLocation || 'Cheshire CT')}&destination=1021+S+Main+St+Cheshire+CT`}
                                                    target="_blank" 
                                                    rel="noopener noreferrer"
                                                    className="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-4 py-3 rounded-xl shadow transition flex items-center gap-1.5"
                                                >
                                                    <span>🗺️</span> Navigate Optimized Route
                                                </a>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="py-12 text-center text-slate-500 text-sm">
                                            Your basket is empty. Add items from the Deals tab to calculate your savings!
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* TAB 4: STORE CIRCULARS */}
                        {activeTab === 'flyers' && (
                            <div className="space-y-4">
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5">
                                    <h2 className="font-bold text-base sm:text-lg mb-1 flex items-center gap-2">
                                        <span>📄</span> Local Store Weekly Circulars
                                    </h2>
                                    <p className="text-xs text-slate-400 mb-4">Direct 1-click links to active weekly ads within your 15-minute radius.</p>

                                    <div className="space-y-2.5">
                                        <a href="https://www.bigy.com/weeklycircular" target="_blank" rel="noopener noreferrer" className="block bg-slate-800/80 hover:bg-slate-800 border border-amber-500/30 p-3.5 rounded-xl transition">
                                            <div className="flex justify-between items-center">
                                                <div>
                                                    <p className="font-bold text-amber-300 text-sm">⭐ Big Y Cheshire (Primary Local Hub)</p>
                                                    <p className="text-xs text-slate-400">1021 S Main St, Cheshire, CT • 1.8 mi (4 min away)</p>
                                                </div>
                                                <span className="text-xs bg-amber-500/20 text-amber-300 px-2 py-1 rounded-lg">View Flyer ↗</span>
                                            </div>
                                        </a>

                                        <a href="https://circular.stopandshop.com/" target="_blank" rel="noopener noreferrer" className="block bg-slate-800/50 hover:bg-slate-800 border border-slate-700/60 p-3.5 rounded-xl transition">
                                            <div className="flex justify-between items-center">
                                                <div>
                                                    <p className="font-bold text-slate-200 text-sm">Stop & Shop Cheshire</p>
                                                    <p className="text-xs text-slate-400">275 Highland Ave, Cheshire, CT • 2.4 mi (6 min away)</p>
                                                </div>
                                                <span className="text-xs bg-slate-700 text-slate-300 px-2 py-1 rounded-lg">View Flyer ↗</span>
                                            </div>
                                        </a>

                                        <a href="https://www.shoprite.com/weeklycircular" target="_blank" rel="noopener noreferrer" className="block bg-slate-800/50 hover:bg-slate-800 border border-slate-700/60 p-3.5 rounded-xl transition">
                                            <div className="flex justify-between items-center">
                                                <div>
                                                    <p className="font-bold text-slate-200 text-sm">ShopRite Southington</p>
                                                    <p className="text-xs text-slate-400">750 Queen St, Southington, CT • 4.8 mi (11 min away)</p>
                                                </div>
                                                <span className="text-xs bg-slate-700 text-slate-300 px-2 py-1 rounded-lg">View Flyer ↗</span>
                                            </div>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Mobile Bottom Navigation Bar */}
                    <nav className="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur border-t border-slate-800 py-2 px-6 flex justify-around items-center">
                        <button onClick={() => setActiveTab('deals')} className={`flex flex-col items-center gap-1 transition ${activeTab === 'deals' ? 'text-rose-500' : 'text-slate-400 hover:text-slate-200'}`}>
                            <span className="text-lg">🔥</span>
                            <span className="text-[10px] font-medium">Deals</span>
                        </button>
                        <button onClick={() => setActiveTab('trends')} className={`flex flex-col items-center gap-1 transition ${activeTab === 'trends' ? 'text-rose-500' : 'text-slate-400 hover:text-slate-200'}`}>
                            <span className="text-lg">📈</span>
                            <span className="text-[10px] font-medium">Trends</span>
                        </button>
                        <button onClick={() => setActiveTab('basket')} className={`flex flex-col items-center gap-1 relative transition ${activeTab === 'basket' ? 'text-rose-500' : 'text-slate-400 hover:text-slate-200'}`}>
                            <span className="text-lg">🛒</span>
                            <span className="text-[10px] font-medium">Basket</span>
                            {totalBasketItemsCount > 0 && (
                                <span className="absolute -top-1 right-1 w-4 h-4 bg-rose-600 text-white rounded-full text-[9px] font-bold flex items-center justify-center">
                                    {totalBasketItemsCount}
                                </span>
                            )}
                        </button>
                        <button onClick={() => setActiveTab('flyers')} className={`flex flex-col items-center gap-1 transition ${activeTab === 'flyers' ? 'text-rose-500' : 'text-slate-400 hover:text-slate-200'}`}>
                            <span className="text-lg">📄</span>
                            <span className="text-[10px] font-medium">Flyers</span>
                        </button>
                    </nav>

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
