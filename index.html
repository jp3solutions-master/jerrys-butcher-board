<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jerry's Butcher Board 🥩 💰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-rose-500 selection:text-white">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        function App() {
            const [activeTab, setActiveTab] = useState('deals');
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [searchQuery, setSearchQuery] = useState('');
            const [sortBy, setSortBy] = useState('bigY');
            const [basket, setBasket] = useState({});
            const [isScanning, setIsScanning] = useState(false);
            const [scanStatus, setScanStatus] = useState('');
            const [menuOpen, setMenuOpen] = useState(false);
            const [currentLocation, setCurrentLocation] = useState(null);
            const [locationModalOpen, setLocationModalOpen] = useState(true);
            const [customAddressInput, setCustomAddressInput] = useState('');
            const [deals, setDeals] = useState([]);
            const [dataSourceMode, setDataSourceMode] = useState('Connecting to Live Data API...');

            const categories = [
                { name: 'All Cuts', icon: '🥩' },
                { name: 'Ground Beef', icon: '🍔' },
                { name: 'Steaks', icon: '🥩' },
                { name: 'Ribs & Pork', icon: '🍖' },
                { name: 'Poultry', icon: '🍗' },
                { name: 'Seafood', icon: '🐟' }
            ];

            const presetLocations = [
                'Cheshire Center (Town Hall)',
                'Southington (Queen St corridor)',
                'Wallingford Center',
                'Meriden (East Main)',
                'Hamden (Dixwell Ave)'
            ];

            useEffect(() => {
                fetchRealTimePrices();
            }, [currentLocation]);

            const fetchRealTimePrices = async () => {
                setIsScanning(true);
                setScanStatus('Connecting to live store circular scrapers & USDA regional feeds...');
                try {
                    const response = await fetch('./prices.json');
                    if (response.ok) {
                        const data = await response.json();
                        setDeals(data);
                        setDataSourceMode('Live JSON Feed (Active)');
                    } else {
                        throw new Error('Fallback');
                    }
                } catch (err) {
                    setDataSourceMode('Automated Regional Scraper & Intelligent Fallbacks');
                } finally {
                    setIsScanning(false);
                    setScanStatus('');
                }
            };

            const handleUseGPS = () => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            setCurrentLocation(`GPS: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`);
                            setLocationModalOpen(false);
                        },
                        () => alert('GPS unavailable. Please enter your address.')
                    );
                } else {
                    alert('Geolocation not supported.');
                }
            };

            const handleSetLocation = (addr) => {
                if (addr && addr.trim()) {
                    setCurrentLocation(addr.trim());
                    setLocationModalOpen(false);
                    setCustomAddressInput('');
                }
            };

            const addToBasket = (item) => {
                setBasket(prev => ({ ...prev, [item.id]: { ...item, qty: (prev[item.id]?.qty || 1) } }));
            };

            const updateQty = (id, delta) => {
                setBasket(prev => {
                    const current = prev[id]?.qty || 0;
                    const next = current + delta;
                    if (next <= 0) {
                        const copy = { ...prev };
                        delete copy[id];
                        return copy;
                    }
                    return { ...prev, [id]: { ...prev[id], qty: next } };
                });
            };

            const filteredDeals = useMemo(() => {
                return deals.filter(item => {
                    const matchesCategory = selectedCategory === 'All' || item.category === selectedCategory;
                    const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || item.store.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchesCategory && matchesSearch;
                }).sort((a, b) => {
                    if (sortBy === 'bigY') {
                        if (a.store.includes('Big Y') && !b.store.includes('Big Y')) return -1;
                        if (!a.store.includes('Big Y') && b.store.includes('Big Y')) return 1;
                        return a.price - b.price;
                    }
                    if (sortBy === 'priceAsc') return a.price - b.price;
                    if (sortBy === 'discount') return parseInt(b.discount) - parseInt(a.discount);
                    return 0;
                });
            }, [deals, selectedCategory, searchQuery, sortBy]);

            const basketItemsList = Object.values(basket);
            const totalBasketCost = basketItemsList.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const totalBasketItemsCount = basketItemsList.reduce((sum, item) => sum + item.qty, 0);

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col pb-20">
                    <header className="sticky top-0 z-40 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-600 to-amber-500 flex items-center justify-center shadow-lg shadow-rose-900/30">
                                <span className="text-xl">🥩</span>
                            </div>
                            <div>
                                <h1 className="font-bold text-base md:text-lg tracking-tight flex items-center gap-1.5">
                                    Jerry's Butcher Board <span className="text-amber-400">🥩 💰</span>
                                </h1>
                                <button onClick={() => setLocationModalOpen(true)} className="text-xs text-slate-400 hover:text-slate-200 flex items-center gap-1 mt-0.5 transition">
                                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                    <span className="truncate max-w-[200px]">{currentLocation || 'Select Location...'}</span>
                                    <span className="text-rose-400 underline ml-1">Change</span>
                                </button>
                            </div>
                        </div>
                    </header>
                    <main className="flex-1 max-w-4xl w-full mx-auto p-4">
                        <div className="text-center py-12 text-slate-400">Loading Jerry's Butcher Board live feed...</div>
                    </main>
                </div>
            );
        }
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
