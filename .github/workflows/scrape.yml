def determine_category(name):
    n = name.lower()
    if 'ground' in n or 'burger' in n:
        return 'Ground Beef'
    elif 'steak' in n or 'ribeye' in n or 'strip' in n:
        return 'Steaks'
    elif 'pork' in n or 'rib' in n:
        return 'Ribs & Pork'
    elif 'chicken' in n or 'poultry' in n or 'turkey' in n:
        return 'Poultry'
    elif 'salmon' in n or 'cod' in n or 'seafood' in n or 'fish' in n:
        return 'Seafood'
    return 'All Cuts'

def main():
    print("Scraping live store circulars...")
    items = fetch_big_y_live_deals()
    with open('prices.json', 'w') as f:
        json.dump(items, f, indent=2)
    print(f"Successfully updated prices.json with {len(items)} items!")

if __name__ == '__main__':
    main()
